<meta name="description" content="Grupo gratuito no WhatsApp para quem quer trabalhar com guestbook de fotos Polaroid em casamentos e eventos." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="../grupo-print-thalita.jpg">
<style>
:root{
  /* Paleta do WhatsApp (modo escuro) */
  --bg:#0B141A; --panel:#202C33; --bolha:#005C4B; --campo:#2A3942;
  --verde:#25D366; --azul:#53BDEB; --txt:#E9EDEF; --muted:#8696A0; --err:#F15C6D;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:'Manrope',system-ui,Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
img{display:block;max-width:100%}

/* Uma coluna estreita e centralizada: uma coisa por vez */
.wrap{max-width:440px;margin:0 auto;padding:22px 20px 36px}
.marca{display:flex;align-items:center;justify-content:center;gap:8px;font-size:.82rem;font-weight:700;color:var(--muted);margin-bottom:18px}
.marca svg{width:18px;height:18px;color:var(--verde)}
.progresso{display:flex;gap:6px;margin:0 auto 22px;max-width:120px}
.progresso span{flex:1;height:4px;border-radius:4px;background:var(--campo);transition:background .3s}
.progresso span.on{background:var(--verde)}

.etapa{display:none;animation:entra .35s ease}
.etapa.on{display:block}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.imagem{width:100%;height:210px;object-fit:cover;border-radius:18px;margin-bottom:24px}
h1,h2{font-weight:800;line-height:1.2;letter-spacing:-.015em;text-align:center;text-wrap:balance}
h1{font-size:1.65rem;margin-bottom:8px}
h2{font-size:1.45rem;margin-bottom:22px}
.verde{color:var(--verde)}
.pergunta{text-align:center;font-size:1.08rem;font-weight:700;margin:14px 0 18px}

/* Opções como balões de mensagem: tocar = responder */
.opcao{position:relative;display:block;width:100%;text-align:left;font:inherit;color:var(--txt);background:var(--panel);border:0;border-radius:16px 16px 16px 4px;padding:17px 20px;margin-bottom:12px;cursor:pointer;transition:background .15s,transform .15s}
.opcao:hover{transform:translateY(-1px);background:#26353D}
.opcao b{display:block;font-size:1.05rem}
.opcao small{display:block;color:var(--muted);font-size:.84rem;margin-top:2px}
.opcao.marcada{background:var(--bolha);border-radius:16px 16px 4px 16px}
.opcao.marcada small{color:#C4D7D2}
.opcao.marcada::after{content:"✓✓";position:absolute;right:14px;bottom:8px;font-size:.72rem;letter-spacing:-.15em;color:var(--azul);font-weight:800}

input[type=text],input[type=tel],input[type=email]{width:100%;font:inherit;font-size:1rem;color:var(--txt);background:var(--campo);border:1.5px solid transparent;border-radius:14px;padding:15px 18px;margin-bottom:12px;outline:none;transition:border-color .15s}
input::placeholder{color:var(--muted)}
input:focus{border-color:var(--verde)}
input.bad{border-color:var(--err)}
.consent{display:flex;gap:10px;align-items:flex-start;margin:6px 0 2px;font-size:.8rem;color:var(--muted);line-height:1.4;cursor:pointer}
.consent input{margin-top:2px;accent-color:var(--verde);width:16px;height:16px;flex:none}
.consent.bad{color:var(--err)}
.err{color:var(--err);font-size:.8rem;min-height:1.2em;margin-top:6px;text-align:center}
.btn{display:flex;width:100%;align-items:center;justify-content:center;gap:10px;font-family:inherit;font-weight:800;font-size:1.05rem;padding:17px 24px;border-radius:60px;cursor:pointer;border:0;margin-top:10px;background:var(--verde);color:#0B141A;transition:transform .18s;text-decoration:none}
.btn:hover{transform:translateY(-2px)}
.btn svg{width:22px;height:22px}
.btn[disabled]{opacity:.7;cursor:wait;transform:none}
.voltar{display:block;margin:16px auto 0;background:none;border:0;color:var(--muted);font:inherit;font-size:.85rem;cursor:pointer}
.ok{width:64px;height:64px;border-radius:50%;margin:10px auto 18px;background:var(--verde);display:grid;place-items:center;color:#0B141A}
.ok svg{width:34px;height:34px}
</style>
</head>
<body>
<div class="wrap">
  <div class="marca">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.2.5.1.6-.1l.8-1c.2-.3.4-.2.7-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>
    Comunidade Inframe
  </div>
  <div class="progresso" id="progresso"><span class="on"></span><span></span><span></span></div>

  <!-- Etapa 1 -->
  <section class="etapa on" data-etapa="1">
    <img class="imagem" src="../guestbook-principal.jpeg" alt="" style="object-position:center 78%" />
    <h1>Grupo gratuito de <span class="verde">guestbook Polaroid</span></h1>
    <p class="pergunta">Você já trabalha com eventos?</p>
    <button class="opcao" data-p="trabalha_eventos" data-v="sim">
      <b>Sim, já trabalho</b><small>Guestbook, storymaker, videomaker, fotógrafo...</small>
    </button>
    <button class="opcao" data-p="trabalha_eventos" data-v="nao">
      <b>Ainda não</b>
    </button>
  </section>

  <!-- Etapa 2 -->
  <section class="etapa" data-etapa="2">
    <img class="imagem" src="../grupo-print-thalita.jpg" alt="" style="object-position:center 22%" />
    <h2>O que você mais quer aprender no grupo?</h2>
    <button class="opcao" data-p="interesse" data-v="guestbook"><b>Como trabalhar com guestbook Polaroid</b></button>
    <button class="opcao" data-p="interesse" data-v="clientes"><b>Como conseguir clientes</b></button>
    <button class="voltar" data-voltar="1">← voltar</button>
  </section>

  <!-- Etapa 3 -->
  <section class="etapa" data-etapa="3">
    <form id="form" novalidate>
      <h2>Pra onde mandamos o link do grupo?</h2>
      <input type="text" id="nome" name="nome" autocomplete="name" placeholder="Seu nome" aria-label="Nome" required />
      <input type="tel" id="telefone" name="telefone" autocomplete="tel" inputmode="numeric" placeholder="WhatsApp com DDD" aria-label="WhatsApp" required />
      <input type="email" id="email" name="email" autocomplete="email" placeholder="Seu e-mail" aria-label="E-mail" required />
      <label class="consent" id="consentLabel">
        <input type="checkbox" id="consent" />
        <span>Autorizo a Inframe a falar comigo por WhatsApp e e-mail.</span>
      </label>
      <div class="err" id="err"></div>
      <button type="submit" class="btn" id="enviar">Entrar no grupo</button>
      <button type="button" class="voltar" data-voltar="2">← voltar</button>
    </form>
  </section>

  <!-- Fim -->
  <section class="etapa" data-etapa="4">
    <div class="ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2>Tudo certo!</h2>
    <a class="btn" id="entrar" href="https://chat.whatsapp.com/LrPqzVzJGmx42VJkcuuJYA"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.2.5.1.6-.1l.8-1c.2-.3.4-.2.7-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>Abrir o grupo no WhatsApp</a>
  </section>
</div>

<script>
var PLANILHA_URL = 'https://script.google.com/macros/s/AKfycbz1zNCVmA9o8LFxu35M7SQlIkFdYLkg6xuBdacjimYzjcdQU1hCYvLoFJpqKsNTFejl-g/exec';
var GRUPO_URL = 'https://chat.whatsapp.com/LrPqzVzJGmx42VJkcuuJYA';
var respostas = { trabalha_eventos: '', interesse: '' };

function track(nome, dados) { if (typeof fbq === 'function') fbq('trackCustom', nome, dados || {}); }
function marca(chave, valor) { if (typeof clarity === 'function') clarity('set', chave, valor); }

function irPara(n) {
  document.querySelectorAll('.etapa').forEach(function (e) { e.classList.toggle('on', e.dataset.etapa == n); });
  document.querySelectorAll('#progresso span').forEach(function (s, i) { s.classList.toggle('on', i < Math.min(n, 3)); });
  document.getElementById('progresso').style.visibility = n === 4 ? 'hidden' : 'visible';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.querySelectorAll('.opcao').forEach(function (b) {
  b.addEventListener('click', function () {
    var p = b.dataset.p, v = b.dataset.v;
    respostas[p] = v;
    document.querySelectorAll('.opcao[data-p="' + p + '"]').forEach(function (o) { o.classList.toggle('marcada', o === b); });
    marca(p, v);
    if (p === 'trabalha_eventos') {
      track('QuizPergunta1', { trabalha_eventos: v });
      setTimeout(function () { irPara(2); }, 260);
    } else {
      track('QuizPergunta2', { trabalha_eventos: respostas.trabalha_eventos, interesse: v });
      setTimeout(function () { irPara(3); }, 260);
    }
  });
});
document.querySelectorAll('[data-voltar]').forEach(function (b) {
  b.addEventListener('click', function () { irPara(+b.dataset.voltar); });
});

var tel = document.getElementById('telefone');
tel.addEventListener('input', function () {
  var d = tel.value.replace(/\D/g, '').slice(0, 11);
  var r = d;
  if (d.length > 2) r = '(' + d.slice(0, 2) + ') ' + d.slice(2);
  if (d.length > 7) r = '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7);
  tel.value = r;
});

function utms() {
  var p = new URLSearchParams(location.search), o = {};
  ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term'].forEach(function (k) { o[k] = p.get(k) || ''; });
  return o;
}

document.getElementById('form').addEventListener('submit', function (e) {
  e.preventDefault();
  var nome = document.getElementById('nome'), email = document.getElementById('email');
  var consent = document.getElementById('consent'), err = document.getElementById('err');
  [nome, tel, email].forEach(function (i) { i.classList.remove('bad'); });
  document.getElementById('consentLabel').classList.remove('bad');

  var digitos = tel.value.replace(/\D/g, '');
  var problemas = [];
  if (nome.value.trim().length < 2) { nome.classList.add('bad'); problemas.push('nome'); }
  if (digitos.length < 10) { tel.classList.add('bad'); problemas.push('WhatsApp com DDD'); }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim())) { email.classList.add('bad'); problemas.push('e-mail'); }
  if (!consent.checked) { document.getElementById('consentLabel').classList.add('bad'); problemas.push('autorização'); }
  if (problemas.length) { err.textContent = 'Confira: ' + problemas.join(', ') + '.'; return; }
  err.textContent = '';

  var btn = document.getElementById('enviar');
  btn.disabled = true; btn.textContent = 'Enviando...';

  var dados = Object.assign({
    nome: nome.value.trim(),
    telefone: digitos,
    email: email.value.trim().toLowerCase(),
    trabalha_eventos: respostas.trabalha_eventos === 'sim' ? 'Sim' : 'Não',
    interesse: respostas.interesse === 'clientes' ? 'Conseguir clientes' : 'Trabalhar com guestbook',
    pagina: location.href.split('?')[0]
  }, utms());

  if (typeof fbq === 'function') fbq('track', 'Lead', { content_name: 'Comunidade Inframe', trabalha_eventos: respostas.trabalha_eventos, interesse: respostas.interesse });
  if (typeof clarity === 'function') clarity('event', 'lead_grupo');

  var envio = fetch(PLANILHA_URL, { method: 'POST', mode: 'no-cors', body: new URLSearchParams(dados) }).catch(function () {});

  // Dá tempo do pixel e da planilha saírem antes de abrir o WhatsApp
  Promise.race([envio, new Promise(function (r) { setTimeout(r, 2500); })]).then(function () {
    irPara(4);
    setTimeout(function () { location.href = GRUPO_URL; }, 1200);
  });
});
</script>
</body>
</html>
